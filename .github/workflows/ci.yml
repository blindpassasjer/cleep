name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleep
          POSTGRES_PASSWORD: cleep
          POSTGRES_DB: cleep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleep -d cleep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://cleep:cleep@localhost:5432/cleep_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run server:build

      - run: npm test
